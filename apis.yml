aid: waterlily
name: Waterlily
description: 'Waterlily is an AI-native, end-to-end long-term care (LTC) planning
  platform for financial advisors, insurance professionals, and the families they
  serve. Trained on more than 500 million data points, its models predict an
  individual''s personalized likelihood of needing long-term care, project the cost
  and duration of that care, and estimate the caregiving hours each family member is
  likely to contribute. A roughly three-minute intake produces a personalized care
  timeline and plan with localized cost estimates, and its Quote-and-Apply engine
  computes mathematically optimal LTC insurance policy configurations across hundreds
  of thousands of options. Founded by Lily Vittayarukskul and backed by Insight
  Partners. Waterlily is surfaced in the API Evangelist network as a portfolio-lead
  company; it exposes no public developer API today (integrations are one-click CRM
  imports for Salesforce, Wealthbox, and Redtail).'
